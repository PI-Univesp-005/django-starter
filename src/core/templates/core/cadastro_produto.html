{% extends "core/base.html" %}

{% block title %}Cadastrar Produto — Estoque+Validade{% endblock %}

{% block content %}
<div class="topbar">
  <a href="{% url 'menu' %}" class="back-btn">← Voltar</a>
  <div class="topbar-title">Cadastrar / editar produto</div>
  <span class="role-badge role-{% if user.perfil == 'gerente' %}adm{% else %}lider{% endif %}">
    {% if user.perfil == 'gerente' %}ADM{% else %}Líder{% endif %}
  </span>
</div>

<div class="card">
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Emoji do produto</label>
      <input type="text" name="emoji" value="{{ produto.emoji|default:'📦' }}" maxlength="10" />
    </div>
    <div class="field">
      <label>Nome do produto</label>
      <input type="text" name="nome" value="{{ produto.nome|default:'' }}" required />
    </div>
    <div class="field">
      <label>Código de barras</label>
      <input type="text" name="codigo_barras" value="{{ produto.codigo_barras|default:'' }}" />
    </div>
    <div class="field">
      <label>Descrição</label>
      <input type="text" name="descricao" value="{{ produto.descricao|default:'' }}" />
    </div>
    <div class="field">
      <label>Margem de promoção (dias antes de vencer)</label>
      <input type="number" name="dias_margem_promocao" value="{{ produto.dias_margem_promocao|default:30 }}" />
    </div>
    <button type="submit" class="btn btn-dark">Salvar produto</button>
    {% if produto %}
    <a href="{% url 'deletar_produto' produto.pk %}" class="btn btn-red" style="margin-top:8px;display:block;text-align:center;text-decoration:none;">Excluir produto</a>
    {% endif %}
  </form>
</div>
{% endblock %}
