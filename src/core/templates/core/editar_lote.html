{% extends "core/base.html" %}

{% block title %}Editar Lote — Estoque+Validade{% endblock %}

{% block content %}
<div class="topbar">
  <a href="{% url 'estoque_detalhe' lote.produto.pk %}" class="back-btn">← Voltar</a>
  <div class="topbar-title">Editar lote</div>
</div>

<div class="card">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
    <div class="prod-img" style="width:52px;height:52px;font-size:26px;">{{ lote.produto.emoji }}</div>
    <div>
      <div style="font-size:16px;font-weight:700;color:#1a1a2e;">{{ lote.produto.nome }}</div>
      <div style="font-size:12px;color:#888;">Lote {{ lote.numero_lote|default:"s/n" }}</div>
    </div>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Número do lote (opcional)</label>
      <input type="text" name="numero_lote" value="{{ lote.numero_lote }}" placeholder="Ex: 3030" />
    </div>
    <div class="field">
      <label>Data de validade</label>
      <input type="date" name="data_validade" value="{{ lote.data_validade|date:'Y-m-d' }}" required />
    </div>
    <button type="submit" class="btn btn-dark">Salvar</button>
  </form>
  <a href="{% url 'estoque_detalhe' lote.produto.pk %}" class="btn btn-outline">Cancelar</a>
</div>
{% endblock %}
