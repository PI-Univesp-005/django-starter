{% extends "core/base.html" %}

{% block title %}FreshStock - Editar Lote{% endblock %}

{% block content %}
<div class="topo-navegacao">
  <div class="titulo-pagina">📦 Editar lote</div>
  <a href="{% url 'estoque_detalhe' lote.produto.pk %}" class="btn-voltar">← Voltar</a>
</div>

<div style="background: #f8f9fa; border-radius: 15px; padding: 15px; display: flex; align-items: center; margin-bottom: 20px; border: 1px solid #f1f2f6;">
  <div class="prod-icon" style="font-size: 24px;">{{ lote.produto.emoji }}</div>
  <div class="prod-info" style="flex: 1;">
    <b>{{ lote.produto.nome }}</b>
    <span style="font-size: 11px;">Lote {{ lote.numero_lote|default:"s/n" }}</span>
  </div>
</div>

<div style="background: white; border: 1px solid #f1f2f6; border-radius: 15px; padding: 20px;">
  <form method="post" data-edit-form>
    {% csrf_token %}
    <div class="field">
      <label>Número do lote (opcional)</label>
      <input type="text" name="numero_lote" value="{{ lote.numero_lote }}" placeholder="Ex: 3030" />
    </div>
    <div class="field">
      <label>Data de validade</label>
      <input type="date" name="data_validade" value="{{ lote.data_validade|date:'Y-m-d' }}" required />
    </div>
    <div class="field">
      <label>Quantidade (UN)</label>
      <input type="number" name="quantidade" value="{{ lote.quantidade }}" min="0" required />
    </div>
    <button type="submit" class="btn btn-dark">Salvar</button>
  </form>
  <a href="{% url 'estoque_detalhe' lote.produto.pk %}" class="btn btn-outline">Cancelar</a>
</div>



{% endblock %}
