
{% extends "core/base.html" %}

{% block user_badge %}{% endblock %}

{% load static %}  

{% block title %}FreshStock — Login{% endblock %}

{% block content %}
<div style="margin-bottom: -5px;display: flex; justify-content: center; align-items: center; flex-direction: column;">
  <img src="{% static 'img/logo_brand.png' %}" alt="Logo FreshStock" style="width: 44%; background: white; padding: 10px;" />
  <sup class="subtitle">Evite desperdício. Reduza custos.</sup>
</div>

<div style="background: white; border: 1px solid #f1f2f6; border-radius: 15px; padding: 20px; margin-top: 10px;">
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Usuário</label>
      <input type="text" name="username" placeholder="Seu usuário" required />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" name="password" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn btn-dark">Entrar</button>
  </form>
</div>

<div class="hint" style="margin-top: 20px;">PI-005 UNIVESP 2026</div>
{% endblock %}
