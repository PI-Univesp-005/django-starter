<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Estoque+Validade{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 2rem 1rem; }
    .device { background: #fff; width: 100%; max-width: 420px; min-height: 700px; border-radius: 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.13); overflow: hidden; display: flex; flex-direction: column; }
    .device-header { background: #1a1a2e; padding: 12px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
    .device-title { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }
    .content { flex: 1; padding: 1.25rem; display: flex; flex-direction: column; gap: 12px; }
    .topbar { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; margin-bottom: 4px; }
    .topbar-title { font-size: 15px; font-weight: 600; color: #1a1a2e; flex: 1; }
    .back-btn { font-size: 13px; color: #2980b9; text-decoration: none; }
    .back-btn:hover { text-decoration: underline; }
    .role-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .role-adm { background: #fde8e8; color: #c0392b; }
    .role-lider { background: #fef9e7; color: #b7770d; }
    .role-func { background: #e8f4fd; color: #2980b9; }
    .btn { display: block; width: 100%; padding: 11px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; margin-bottom: 8px; }
    .btn-dark { background: #1a1a2e; color: #fff; }
    .btn-lider { background: #b7770d; color: #fff; }
    .btn-outline { background: #fff; color: #1a1a2e; border: 1.5px solid #ddd; }
    .btn-green { background: #27ae60; color: #fff; }
    .btn-red { background: #e74c3c; color: #fff; }
    .btn-gray { background: #f5f5f5; color: #333; border: 1.5px solid #ddd; }
    .card { background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 12px; }
    .card-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .field label { font-size: 12px; font-weight: 600; color: #555; }
    .field input, .field select { padding: 10px 12px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px; color: #1a1a2e; outline: none; background: #fff; }
    .field input:focus, .field select:focus { border-color: #2980b9; }
    .hint { font-size: 12px; color: #aaa; text-align: center; }
    .alert-box { border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
    .alert-warning { background: #fef9e7; color: #9a7d0a; border-left: 3px solid #f1c40f; }
    .alert-info { background: #e8f4fd; color: #1a5276; border-left: 3px solid #2980b9; }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .badge-green { background: #eafaf1; color: #1e8449; }
    .badge-orange { background: #fef9e7; color: #b7770d; }
    .badge-red { background: #fdecea; color: #c0392b; }
    .product-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
    .product-row:last-child { border-bottom: none; }
    .prod-img { width: 42px; height: 42px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .prod-info { flex: 1; }
    .prod-name { font-size: 14px; font-weight: 600; color: #1a1a2e; }
    .prod-code { font-size: 11px; color: #888; margin-top: 2px; }
    .lot-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lot-table th { text-align: left; padding: 6px; color: #888; font-weight: 600; border-bottom: 1px solid #f0f0f0; font-size: 11px; text-transform: uppercase; }
    .lot-table td { padding: 9px 6px; border-bottom: 1px solid #f9f9f9; color: #1a1a2e; vertical-align: middle; }
    .messages { list-style: none; margin-bottom: 12px; }
    .messages li { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 6px; }
    .messages .error { background: #fdecea; color: #c0392b; }
    .messages .success { background: #eafaf1; color: #1e8449; }
  </style>
</head>
<body>
<div class="device">
  <div class="device-header">
    <div class="device-title">ESTOQUE+VALIDADE</div>
  </div>
  <div class="content">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
