<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal — Estoque+Validade</title>
    <style>
        /* Estilos básicos para ficar igual ao seu protótipo */
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; width: 350px; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { background: #1a1a2e; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header span { font-weight: bold; font-size: 14px; }
        .badge { background: #e94560; padding: 4px 8px; border-radius: 10px; font-size: 10px; }
        .conteudo { padding: 20px; }
        .user-type { float: right; background: #eef2ff; color: #6366f1; padding: 4px 12px; border-radius: 15px; font-size: 12px; }
        h2 { font-size: 18px; margin-top: 0; color: #333; }
        .item-menu { 
            display: flex; align-items: center; border: 1px solid #eee; 
            padding: 15px; border-radius: 15px; margin-top: 20px; text-decoration: none; color: inherit;
        }
        .icon { font-size: 30px; margin-right: 15px; background: #f0fdf4; padding: 10px; border-radius: 12px; }
        .texto-item b { display: block; font-size: 14px; }
        .texto-item span { font-size: 12px; color: #888; }
        .btn-sair { 
            width: 100%; margin-top: 30px; padding: 12px; border-radius: 10px; 
            border: 1px solid #ccc; background: white; cursor: pointer; font-weight: bold;
        }
        .btn-sair:hover { background: #f9f9f9; }
        a { text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span>ESTOQUE+VALIDADE</span>
            <span class="badge">PROTÓTIPO v4</span>
        </div>

        <div class="conteudo">
            <span class="user-type">Funcionário</span>
            <h2>Menu principal</h2>

            <a href="/movimentacao/" class="item-menu">
                <div class="icon">📦</div>
                <div class="texto-item">
                    <b>Movimentação de estoque</b>
                    <span>Consultar, atualizar e controlar validade</span>
                </div>
                <span style="margin-left: auto; color: #ccc;">›</span>
            </a>

            <a href="/login/">
                <button class="btn-sair">Sair</button>
            </a>
        </div>
    </div>

</body>
</html>
